[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcp-congestion"
version = "0.1.0"
description = "TCP congestion-window behaviour under LLM-style idle gaps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
