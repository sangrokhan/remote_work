services:

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    # NET_ADMIN: tc netem / ip link, and ethtool -K offload toggling
    cap_add:
      - NET_ADMIN
    environment:
      # Inject one-way delay on the server's egress (server → client path)
      - NETEM_DELAY_MS=${SERVER_NETEM_DELAY_MS:-0}
      - NETEM_IFACE=${SERVER_NETEM_IFACE:-eth0}
      # Disable TSO/GSO/SG/GRO/LRO for a literal one-packet-per-segment view
      - NIC_OFFLOAD_DISABLE=${NIC_OFFLOAD_DISABLE:-0}
      - NIC_OFFLOAD_IFACE=${SERVER_NETEM_IFACE:-eth0}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8888
    ports:
      - "${SERVER_HOST_PORT:-8888}:8888"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    # NET_ADMIN: tc netem / ip link, ethtool -K offload toggling, and the
    # cwnd monitor's netlink sock_diag socket. NET_RAW: tcpdump capture.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Inject one-way delay on the client's egress (client → server path)
      - NETEM_DELAY_MS=${CLIENT_NETEM_DELAY_MS:-0}
      - NETEM_IFACE=${CLIENT_NETEM_IFACE:-eth0}
      # Disable TSO/GSO/SG/GRO/LRO for a literal one-packet-per-segment view
      - NIC_OFFLOAD_DISABLE=${NIC_OFFLOAD_DISABLE:-0}
      - NIC_OFFLOAD_IFACE=${CLIENT_NETEM_IFACE:-eth0}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=10000
      - TRAFFIC_PCAP_IFACE=${CLIENT_NETEM_IFACE:-eth0}
    ports:
      - "${CLIENT_HOST_PORT:-10000}:10000"
    volumes:
      # Captured pcaps persist across container restarts and stay
      # inspectable on the host with Wireshark.
      - ./data/pcaps:/app/data/pcaps
    depends_on:
      - server
