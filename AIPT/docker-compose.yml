# docker-compose.yml -- AIPT container topology (DESIGN.md 4, 4.7 B10, and
# 4.7 "미해결 세부사항" 1 확정 설계).
#
# 4-service topology: web -> gateway -> {mock-server, local-llm}. Both
# mock-server and local-llm sit on net-backend and are reachable only
# through gateway, mirroring DESIGN.md 4's original "web/gateway/
# mock-server/local-llm-gateway(+engine)" plan -- local-llm was deferred
# past the first Docker pass (a real llama.cpp container looked heavy) but
# is now included: docker/Dockerfile.local_llm wraps the upstream
# ghcr.io/ggml-org/llama.cpp:server image (real llama-server binary, no
# inference reimplemented here) the same way Dockerfile.mockserver wraps
# aipt.backends.mock.server.
#
# Port convention: local-llm listens on 40080 (the 40000s), not
# llama-server's own classic 8080 default -- 8080 is already `gateway`'s
# port in this stack. scripts/run_local_llm_engine.sh (the bare-metal/host
# alternative to this container) uses the same 40080 default so both paths
# agree without a developer needing to remember two different ports.
#
# DESIGN.md 4.7 decision: MockBackend/LocalLLMBackend traffic must go via the
# `gateway` service (tc netem delay/jitter/loss/reorder injection into that
# path); PublicAIBackend (Gemini/OpenAI) goes straight to the real internet
# and never touches `gateway`.
#
# DESIGN.md 4.7 "미해결 세부사항 1" 확정 (2026-08-26): L3 라우팅. `gateway`는
# TCP 상태를 보지 않는 순수 커널 IP 포워딩 컨테이너다 -- 애플리케이션 레벨
# 프록시/relay 코드가 아니라 `net.ipv4.ip_forward=1` + 두 개의 분리된 브리지
# 네트워크(`net-client`, `net-backend`)로 구현한다:
#   - `web`은 `net-client`에만 속한다.
#   - `mock-server`/`local-llm`은 `net-backend`에만 속한다.
#   - `gateway`는 두 네트워크 모두에 속하고, `net.ipv4.ip_forward=1`로 그
#     사이를 라우팅한다.
#   - 왕복 트래픽이 반드시 `gateway`를 통과하도록, `web`/`mock-server`/
#     `local-llm`은 컨테이너 시작 시 상대 네트워크로 가는 경로를 `gateway`의
#     자기 네트워크 내 IP를 통해 명시적으로 라우팅한다
#     (`docker/entrypoint_web.py`, `docker/entrypoint_mockserver.py`,
#     `docker/entrypoint_local_llm.py`의 `ip route add`).
#   - `tc netem`은 `gateway`의 양쪽 인터페이스(client-facing, backend-facing)
#     egress 모두에 동일 프로파일이 적용된다 (`aipt/gateway/netem_control.py`
#     `apply_profile_both`).

networks:
  # 172.28.1.0/24 -- web + gateway (gateway's net-client-side IP is the
  # `via` target for mock-server's/local-llm's route back to web).
  net-client:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  # 172.28.2.0/24 -- mock-server + local-llm + gateway (gateway's
  # net-backend-side IP is the `via` target for web's route to either).
  net-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24

services:

  mock-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mockserver
    # NET_ADMIN: entrypoint_mockserver.py's `ip route add` back to
    # net-client via `gateway` (DESIGN.md 4.7 확정 설계 1 -- forces response
    # traffic through gateway instead of a shortcut return path).
    #
    # (privileged: true was granted here 2026-09-01 for an idle-reset
    # sysctl write that lived on this container -- removed 2026-09-02 once
    # the idle-reset redesign moved that toggle entirely to `web` and the
    # mock-server-side /admin/idle-reset route was deleted as dead code.)
    cap_add:
      - NET_ADMIN
    networks:
      net-backend:
        # Fixed IP so mock-server never grabs 172.28.2.2, which gateway
        # itself pins on net-backend below -- Docker's dynamic IPAM
        # allocates addresses in join order, and mock-server starts first
        # (it's gateway's dependency), so without a fixed address here it
        # non-deterministically wins the race for gateway's own address
        # and gateway's `docker compose up` fails with "Address already
        # in use".
        ipv4_address: ${MOCK_SERVER_IP:-172.28.2.3}
    environment:
      - MOCK_HOST=0.0.0.0
      - MOCK_PORT=8888
      # Route setup (docker/entrypoint_mockserver.py): net-client subnet,
      # reached via gateway's IP on net-backend.
      - GATEWAY_PEER_SUBNET=${NET_CLIENT_SUBNET:-172.28.1.0/24}
      - GATEWAY_ROUTE_VIA=${GATEWAY_BACKEND_IP:-172.28.2.2}
    # No `ports:` mapping on purpose -- DESIGN.md 4.7's topology requires
    # mock-server to be reachable only through `gateway` (and, from the
    # host's point of view, not at all). Other services reach it at
    # mock-server:8888, but only `gateway` (on net-backend) actually can --
    # `web` is not on net-backend at all, by design.
    expose:
      - "8888"

  # QUIC idle-probe spike (DESIGN.md "QUIC idle-probe spike" section,
  # aipt/backends/quic_mock/). Same net-backend-only / gateway-routed
  # topology as mock-server, but UDP instead of TCP -- QUIC rides on UDP,
  # and the Gateway's L3 IP forwarding + netem are protocol-agnostic (they
  # operate on the interface, not on TCP state), so this traffic traverses
  # the exact same impaired path mock-server's TCP traffic does without any
  # Gateway changes. Only started when explicitly requested
  # (`docker compose up quic-mock-server gateway web`), since it is a
  # spike, not part of the default 4-service topology.
  quic-mock-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.quic_mock_server
    cap_add:
      - NET_ADMIN
    networks:
      net-backend:
        ipv4_address: ${QUIC_MOCK_SERVER_IP:-172.28.2.5}
    environment:
      - QUIC_MOCK_HOST=0.0.0.0
      - QUIC_MOCK_PORT=4433
      - GATEWAY_PEER_SUBNET=${NET_CLIENT_SUBNET:-172.28.1.0/24}
      - GATEWAY_ROUTE_VIA=${GATEWAY_BACKEND_IP:-172.28.2.2}
    expose:
      - "4433/udp"

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    # NET_ADMIN: tc qdisc netem (aipt/gateway/netem_control.py) targeting
    # GATEWAY_CLIENT_IFACE egress+ingress(via GATEWAY_IFB_DEV) and
    # GATEWAY_BACKEND_IFACE egress inside this container's network
    # namespace (2026-09 client-link-only redesign -- only the
    # client-facing leg is shaped both directions; the backend-facing leg
    # always gets a fixed near-zero baseline, see
    # aipt.gateway.netem_control's module docstring). NET_ADMIN also
    # covers `ip link add <ifb> type ifb` for the ingress-shaping
    # workaround (tc netem has no native ingress mode).
    cap_add:
      - NET_ADMIN
    # DESIGN.md 4.7 확정 설계 1: kernel-level IP forwarding between
    # net-client and net-backend. aipt.gateway.forwarding verifies this
    # actually took effect at runtime and surfaces it via GET /health.
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-client:
        ipv4_address: ${GATEWAY_CLIENT_IP:-172.28.1.2}
      net-backend:
        ipv4_address: ${GATEWAY_BACKEND_IP:-172.28.2.2}
    environment:
      - GATEWAY_IFACE=${GATEWAY_IFACE:-eth0}
      - GATEWAY_CLIENT_IFACE=${GATEWAY_CLIENT_IFACE:-eth0}
      - GATEWAY_BACKEND_IFACE=${GATEWAY_BACKEND_IFACE:-eth1}
      # GATEWAY_IFB_DEV: virtual device GATEWAY_CLIENT_IFACE's ingress
      # (client -> Gateway request leg) is redirected to so it can be
      # shaped like any other egress (2026-09 client-link-only redesign).
      # Not needed on the backend leg -- it never carries the
      # user-selected profile, only the fixed ETHERNET_BASELINE.
      - GATEWAY_IFB_DEV=${GATEWAY_IFB_DEV:-ifb0}
      # Default impairment: 20ms one-way delay on the client-facing leg,
      # applied to BOTH directions (egress direct on GATEWAY_CLIENT_IFACE
      # for the response leg, ingress-via-IFB on GATEWAY_IFB_DEV for the
      # request leg) -- so a round trip picks up ~40ms total, all of it on
      # the client-facing (access-network) leg. The backend-facing leg
      # (GATEWAY_BACKEND_IFACE) ignores these knobs entirely: it always
      # gets the fixed ETHERNET_BASELINE regardless of GATEWAY_PROFILE/
      # GATEWAY_DELAY_MS (aipt/gateway/netem_control.py's
      # apply_backend_link_baseline). GATEWAY_PROFILE must be "custom" for
      # GATEWAY_DELAY_MS to take effect (named presets like
      # "clean"/"wired"/"wireless" ignore the individual knobs -- see
      # aipt/gateway/profiles.py resolve()).
      - GATEWAY_PROFILE=${GATEWAY_PROFILE:-custom}
      - GATEWAY_DELAY_MS=${GATEWAY_DELAY_MS:-20}
      - GATEWAY_JITTER_MS=${GATEWAY_JITTER_MS:-0}
      - GATEWAY_LOSS_PCT=${GATEWAY_LOSS_PCT:-0}
      - GATEWAY_REORDER_PCT=${GATEWAY_REORDER_PCT:-0}
      # Documentation only -- with L3 routing, `web` addresses mock-server
      # directly (mock-server:8888) and the kernel forwards the packets via
      # `gateway`; this app itself never proxies the connection.
      - MOCK_SERVER_HOST=mock-server
      - MOCK_SERVER_PORT=8888
    expose:
      - "8080"
    depends_on:
      - mock-server
      - local-llm

  local-llm:
    build:
      context: .
      dockerfile: docker/Dockerfile.local_llm
    # NET_ADMIN: entrypoint_local_llm.py's `ip route add` back to
    # net-client via `gateway` (same DESIGN.md 4.7 확정 설계 1 reasoning as
    # mock-server).
    #
    # (privileged: true was granted here 2026-09-01 for the idle_reset_admin.py
    # sidecar's idle-reset sysctl write -- removed 2026-09-02 along with
    # that sidecar once the idle-reset redesign moved the toggle entirely
    # to `web`.)
    cap_add:
      - NET_ADMIN
    networks:
      net-backend:
        # Fixed IP for the same reason mock-server needs one -- avoid a
        # race with gateway (172.28.2.2) for a dynamically-allocated
        # address on container startup.
        ipv4_address: ${LOCAL_LLM_IP:-172.28.2.4}
    environment:
      - LLAMA_HOST=0.0.0.0
      - LLAMA_PORT=40080
      - MODEL_REPO=${LOCAL_LLM_MODEL_REPO:-bartowski/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M}
      - CTX_SIZE=${LOCAL_LLM_CTX_SIZE:-4096}
      # engine Gateway sidecar (docker/engine_gateway.py, L7 reverse proxy
      # in front of this container's own llama-server) -- see that file's
      # module docstring. `web` targets this port (LOCAL_LLM_ENGINE_URL
      # below), not llama-server's 40080 directly, so caching/experiment
      # hooks sit on the request path: web -> Network Gateway (L3/L4) ->
      # engine Gateway (L7, this) -> llama-server (127.0.0.1:40080, same
      # container/netns).
      - ENGINE_GATEWAY_HOST=0.0.0.0
      - ENGINE_GATEWAY_PORT=40079
      - ENGINE_GATEWAY_UPSTREAM_HOST=127.0.0.1
      - ENGINE_GATEWAY_UPSTREAM_PORT=40080
      # Route setup (docker/entrypoint_local_llm.py): net-client subnet,
      # reached via gateway's IP on net-backend.
      - GATEWAY_PEER_SUBNET=${NET_CLIENT_SUBNET:-172.28.1.0/24}
      - GATEWAY_ROUTE_VIA=${GATEWAY_BACKEND_IP:-172.28.2.2}
    # No `ports:` mapping on purpose -- same DESIGN.md 4.7 topology as
    # mock-server: reachable only via `gateway` (and, from the host, not at
    # all). Other services reach the engine Gateway at local-llm:40079
    # (which itself forwards to llama-server on 40080 inside this
    # container); only `gateway` (on net-backend) actually can reach either.
    expose:
      - "40080"
      - "40079"
    # First boot downloads the GGUF from the HF Hub (bartowski/
    # Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M by default, ~400MB) -- can take a
    # while on a slow connection; the upstream image's own HEALTHCHECK
    # (GET /health) only turns healthy once the model is actually loaded
    # and serving.

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    # NET_RAW: tcpdump packet capture (aipt.core.capture).
    # NET_ADMIN: netlink cwnd monitor (aipt.core.cwnd) + NIC offload toggle
    # (aipt.core.offload) + entrypoint_web.py's `ip route add` to
    # net-backend via `gateway` (DESIGN.md 4.7 확정 설계 1).
    #
    # privileged: true (2026-09-01, idle-reset TTFT experiment, redesign):
    # web is the CLIENT sending each turn's request, and it is web's own
    # send-side cwnd that slow-start-after-idle resets after an idle gap
    # (aipt.core.idle_reset's GET/POST /api/idle-reset,
    # aipt/web/routes_gateway.py). CAP_NET_ADMIN alone cannot write
    # /proc/sys/net/ipv4/tcp_slow_start_after_idle (Docker's default
    # read-only masking of most of /proc/sys).
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - net-client
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=10000
      - TRAFFIC_PCAP_DIR=/app/data/pcaps
      # DESIGN.md TODO #5 (offload-off-by-default): tso/gso/gro on `web`'s
      # own egress interface are turned off around every capture window
      # (aipt.core.offload.Window, driven per-run by aipt/web/routes_run.py
      # now that captures are wired up) so a pcap shows real on-wire MTU/MSS
      # -sized frames instead of kernel super-packets. Requires the
      # NET_ADMIN this service already has (below) for `ethtool -K`.
      - NIC_OFFLOAD_DISABLE=1
      # DESIGN.md 4.7.1: PublicAIBackend request/response JSON, one file per
      # exec_id -- the only persistent-on-disk run artifact this app writes.
      - PUBLIC_AI_RECORDS_DIR=/app/data/public_ai_records
      # aipt/web/store.py: where completed-run JSON docs persist across
      # restarts (MAX_RUNS=50, oldest evicted). Volume-mounted above so
      # host-side history/backup is possible.
      - RUN_STORE_DIR=/app/data/runs
      # PublicAIBackend credentials -- passed through from the host/.env,
      # never baked into the image. Empty is fine; that backend's own
      # ready() check reports "not ready" rather than crashing (see
      # aipt/backends/public_ai/*).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # DESIGN.md 4.7: Gateway's profile-control API (netem presets), not
      # a proxy address -- with L3 routing, Mock/LocalLLM traffic itself is
      # addressed directly (mock-server:8888 / LOCAL_LLM_ENGINE_URL) and
      # traverses `gateway` transparently at the kernel level.
      - GATEWAY_HOST=gateway
      - GATEWAY_PORT=8080
      # Route setup (docker/entrypoint_web.py): net-backend subnet, reached
      # via gateway's IP on net-client.
      - GATEWAY_PEER_SUBNET=${NET_BACKEND_SUBNET:-172.28.2.0/24}
      - GATEWAY_ROUTE_VIA=${GATEWAY_CLIENT_IP:-172.28.1.2}
      # LocalLLMBackend (aipt/backends/local_llm/engine_adapter.py) targets
      # this URL. Default: the `local-llm` service's fixed IP on
      # net-backend (172.28.2.4), port 40079 -- the engine Gateway sidecar
      # (docker/engine_gateway.py), NOT llama-server's own 40080 directly.
      # This is the 2026-09 caching-experiment topology change: web ->
      # Network Gateway (L3/L4 netem, `gateway` service) -> engine Gateway
      # (L7, this port) -> llama-server (127.0.0.1:40080 inside the
      # local-llm container). The engine Gateway is a transparent
      # OpenAI-API-compatible reverse proxy today (empty cache hooks --
      # see that module's docstring), so pointing here vs. straight at
      # 40080 changes nothing observable yet, only adds the L7 hop.
      # Must be the IP, not the `local-llm` hostname: `web` is only joined
      # to net-client, and Docker's embedded DNS only resolves names within
      # networks a container is actually a member of -- the kernel still
      # forwards the *packets* to net-backend via `gateway` (DESIGN.md 4.7
      # 확정 설계 1), but `web` itself can never resolve a net-backend-only
      # hostname.
      # Override to point at a host-run engine instead, e.g.
      # LOCAL_LLM_ENGINE_URL=http://host.docker.internal:40080.
      - LOCAL_LLM_ENGINE_URL=${LOCAL_LLM_ENGINE_URL:-http://172.28.2.4:40079}
      - LOCAL_LLM_ENGINE_KIND=${LOCAL_LLM_ENGINE_KIND:-llama_cpp}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-}
      # aipt.backends.mock.conversation.MockBackend (TCP): same
      # "must resolve to the IP, not the hostname" constraint as
      # LOCAL_LLM_ENGINE_URL above. Without this, every web-UI Mock run
      # spawned its own server on loopback INSIDE this container and
      # never traversed `gateway` at all -- netem had nothing to act on
      # (found 2026-08-31 via a Wireshark capture showing pure loopback
      # traffic on a Mock run). Pointing at the already-built, already
      # gateway-routed `mock-server` service closes that gap; unset this
      # (or run outside Docker) to fall back to the original
      # spawn-our-own-server-on-loopback behaviour.
      - MOCK_SERVER_HOST=${MOCK_SERVER_IP:-172.28.2.3}
      - MOCK_SERVER_PORT=8888
      # QUIC idle-probe spike (aipt/backends/quic_mock/backend.py's
      # QuicMockBackend, DESIGN.md 7.2): same "must resolve to the IP, not
      # the hostname" constraint as LOCAL_LLM_ENGINE_URL above -- `web` is
      # net-client-only, so it can't resolve `quic-mock-server` (a
      # net-backend hostname) via Docker's embedded DNS, even though the
      # kernel still forwards the actual UDP packets to it via `gateway`.
      - QUIC_MOCK_SERVER_HOST=${QUIC_MOCK_SERVER_IP:-172.28.2.5}
      - QUIC_MOCK_SERVER_PORT=4433
    ports:
      - "${WEB_HOST_PORT:-10000}:10000"
    volumes:
      # Captured pcaps persist across container restarts and stay
      # inspectable on the host with Wireshark (tcp_congestion convention).
      - ./data/pcaps:/app/data/pcaps
      # DESIGN.md 4.7.1: Public AI (real Gemini/OpenAI) request/response
      # JSON, one file per exec_id -- kept alongside run history below for
      # anyone directly inspecting a real-API exchange (masked secrets).
      - ./data/public_ai_records:/app/data/public_ai_records
      # aipt/web/store.py: full run history (turns/monitors/CSV inputs),
      # one JSON file per exec_id, capped at MAX_RUNS=50 (oldest evicted).
      # Survives container restarts now instead of only living in the
      # in-process OrderedDict.
      - ./data/runs:/app/data/runs
      # aipt.backends.mock.records.RECORD_DIR -- hand-authored Q&A
      # scenarios (perf.json/smoke.json) that also feed the "Record"
      # dropdown (routes_config.public_ai_record_names()). Volume-mounted
      # (not just baked in by the Dockerfile COPY) so editing/adding a
      # record on the host is picked up on container restart without a
      # rebuild.
      - ./records:/app/records
    depends_on:
      - gateway
      - local-llm
      # mock-server/quic-mock-server: the actual targets MockBackend/
      # QuicMockBackend now connect to via MOCK_SERVER_HOST/
      # QUIC_MOCK_SERVER_HOST above (DESIGN.md 4.7's L3 topology) --
      # `web` doesn't strictly need them running to boot, but listing
      # them here means `docker compose up web` alone brings up its full
      # dependency chain rather than silently failing every Mock run
      # with a connection refused because mock-server was never started.
      - mock-server
      - quic-mock-server
